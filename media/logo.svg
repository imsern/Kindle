<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="70%">
      <stop offset="0" stop-color="#2a2433"/>
      <stop offset="0.55" stop-color="#16131c"/>
      <stop offset="1" stop-color="#0a090d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ff6a1a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="outer" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8361a"/>
      <stop offset="0.55" stop-color="#ff7a1c"/>
      <stop offset="1" stop-color="#ffb52e"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb21f"/>
      <stop offset="1" stop-color="#ffe46a"/>
    </linearGradient>
    <linearGradient id="log" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5530"/>
      <stop offset="1" stop-color="#4a2913"/>
    </linearGradient>
    <radialGradient id="ring" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e7b47c"/>
      <stop offset="0.6" stop-color="#c58a54"/>
      <stop offset="1" stop-color="#7a4a26"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb52e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e8361a" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- Firelight -->
  <ellipse cx="256" cy="300" rx="210" ry="190" fill="url(#glow)"/>
  <ellipse cx="256" cy="398" rx="150" ry="22" fill="#000" opacity="0.45"/>

  <!-- Logs -->
  <g transform="rotate(-16 256 378)">
    <rect x="118" y="356" width="276" height="44" rx="22" fill="url(#log)"/>
    <ellipse cx="140" cy="378" rx="15" ry="22" fill="url(#ring)"/>
    <path d="M190 366 h120" stroke="#a7703f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g transform="rotate(16 256 378)">
    <rect x="118" y="356" width="276" height="44" rx="22" fill="url(#log)"/>
    <ellipse cx="372" cy="378" rx="15" ry="22" fill="url(#ring)"/>
    <path d="M200 366 h120" stroke="#a7703f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Flame -->
  <path fill="url(#outer)" d="M262 84
    C 292 140, 362 178, 356 266
    C 352 330, 310 368, 256 368
    C 200 368, 158 330, 158 274
    C 158 222, 190 196, 206 150
    C 222 186, 232 204, 244 216
    C 240 168, 246 124, 262 84 Z"/>
  <path fill="url(#inner)" d="M262 176
    C 284 214, 318 238, 314 290
    C 312 330, 288 352, 258 352
    C 226 352, 204 330, 204 298
    C 204 266, 222 250, 232 226
    C 240 246, 248 256, 256 264
    C 252 234, 254 204, 262 176 Z"/>
  <path fill="#fff4c4" d="M258 256
    C 274 280, 290 294, 288 320
    C 286 340, 274 352, 258 352
    C 242 352, 228 340, 228 320
    C 228 296, 246 282, 258 256 Z"/>

  <!-- Sparks -->
  <circle cx="352" cy="138" r="7" fill="#ffc24a"/>
  <circle cx="378" cy="96" r="4.5" fill="#ffd36e" opacity="0.85"/>
  <circle cx="170" cy="120" r="5" fill="#ffb02e" opacity="0.8"/>
  <circle cx="148" cy="170" r="3.5" fill="#ffd36e" opacity="0.7"/>
</svg>
